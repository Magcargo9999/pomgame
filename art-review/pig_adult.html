<script>
'use strict';
const P=JSON.parse(document.getElementById('art-data').textContent),$=id=>document.getElementById(id),breedSelect=$('breed'),patternSelect=$('pattern');
let breeds=P.breeds.breeds||P.breeds,playing=true,start=performance.now(),atlas,rows=[],ready=false;
function populate(){breedSelect.replaceChildren();for(const[k,b]of Object.entries(breeds)){let o=document.createElement('option');o.value=k;o.textContent=b.label||k;breedSelect.append(o);}breedSelect.value=breeds.duroc?'duroc':Object.keys(breeds)[0];}
populate();
function image(src){return new Promise((resolve,reject)=>{const i=new Image;i.onload=()=>resolve(i);i.onerror=()=>reject(Error('PNG decode failed'));i.src=src;});}
const hex=(a,i)=>'#'+Array.from(a.slice(i,i+3)).map(v=>v.toString(16).padStart(2,'0')).join('');
function raster(im){const c=document.createElement('canvas');c.width=128;c.height=480;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);return x.getImageData(0,0,128,480);}
let raw={};
function recolor(){const b=breeds[breedSelect.value],map={};for(const s of ['coat','spot','snout'])P.palette.slots[s].forEach((c,i)=>map[c]=b[s][i].slice(1).match(/../g).map(v=>parseInt(v,16)));const base=raw.base,layer=raw[patternSelect.value];const c=document.createElement('canvas');c.width=128;c.height=480;let x=c.getContext('2d'),out=x.createImageData(128,480);for(let i=0;i<out.data.length;i+=4){const source=layer&&layer.data[i+3]?layer:base;if(!source.data[i+3])continue;let v=map[hex(source.data,i)]||Array.from(source.data.slice(i,i+3));out.data.set([...v,255],i);}x.putImageData(out,0,0);atlas=c;$('status').textContent=(b.label||breedSelect.value)+' · '+patternSelect.selectedOptions[0].text+' · 39프레임 / 15행 · 로컬 실행';draw(performance.now());}
function index(a,t){let n=Math.floor((t-start)/a.ms);return a.loop?n%a.frames:Math.min(n,a.frames-1);}
function draw(t){if(!atlas)return;for(const row of rows){let f=playing?index(row.a,t):Number(row.slider.value);row.slider.value=f;row.card.dataset.frame=f;row.counter.textContent=(f+1)+' / '+row.a.frames;for(const c of row.canvases){const s=c.width/32,x=c.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,c.width,c.height);x.save();if($('flip').checked&&row.name.endsWith('_right')){x.translate(c.width,0);x.scale(-1,1);}x.drawImage(atlas,f*32,row.a.row*32,32,32,0,0,32*s,32*s);x.restore();}}}
function loop(t){if(playing)draw(t);requestAnimationFrame(loop);}
function pause(){playing=false;$('play').textContent='재생';}
$('play').onclick=()=>{playing=!playing;if(playing)start=performance.now();$('play').textContent=playing?'일시정지':'재생';draw(performance.now());};
$('restart').onclick=()=>{playing=true;start=performance.now();$('play').textContent='일시정지';draw(start);};
breedSelect.onchange=()=>{patternSelect.value=breeds[breedSelect.value].pattern||'none';recolor();};patternSelect.onchange=recolor;$('flip').onchange=()=>draw(performance.now());
$('breedFile').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text()),next=data.breeds||data;for(const b of Object.values(next))for(const [s,n]of [['coat',4],['spot',4],['snout',3]])if(!Array.isArray(b[s])||b[s].length!==n||b[s].some(c=>!/^#[0-9a-f]{6}$/i.test(c)))throw Error('품종 슬롯 형식을 확인해 주세요.');breeds=next;populate();recolor();}catch(e){$('status').textContent=e.message;}};
Promise.all(Object.entries(P.images).map(async([k,v])=>raw[k]=raster(await image(v)))).then(()=>{for(const[name,a]of Object.entries(P.meta.anims)){let card=document.createElement('section');card.className='card';card.dataset.anim=name;let title=document.createElement('h2');title.textContent=name+' · '+a.ms+'ms'+(a.loop?' · 반복':' · 1회');card.append(title);let scales=document.createElement('div');scales.className='scales';let canvases=[1,4,8].map(s=>{const f=document.createElement('figure'),c=document.createElement('canvas'),caption=document.createElement('figcaption');c.width=c.height=32*s;c.setAttribute('aria-label',name+' '+s+'배');caption.textContent=s+'×';f.append(c,caption);scales.append(f);return c;});card.append(scales);const label=document.createElement('label'),slider=document.createElement('input'),counter=document.createElement('span');slider.type='range';slider.min=0;slider.max=a.frames-1;slider.value=0;slider.setAttribute('aria-label',name+' 프레임');slider.oninput=()=>{pause();draw(performance.now());};label.append(slider,counter);card.append(label);$('grid').append(card);rows.push({name,a,card,canvases,slider,counter});}recolor();ready=true;window.artReview={get ready(){return ready;},metadata:P.meta,get playing(){return playing;},stats:()=>({breed:breedSelect.value,pattern:patternSelect.value,rows:rows.length,canvases:rows.reduce((n,r)=>n+r.canvases.length,0),frames:Object.fromEntries(rows.map(r=>[r.name,Number(r.card.dataset.frame)]))})};requestAnimationFrame(loop);}).catch(e=>{$('status').textContent=e.message;});
</script></html>
