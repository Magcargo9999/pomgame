'use strict';const P=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),N=P.meta.cell[0],W=N*4,H=N*15;let breeds=P.breeds.breeds,raw={},rows=[],atlas,playing=true,start=performance.now();
function populate(){const selected=$('breed').value;$('breed').replaceChildren();for(const[k,b]of Object.entries(breeds)){let o=document.createElement('option');o.value=k;o.textContent=b.label||k;$('breed').append(o);}$('breed').value=breeds[selected]?selected:'yorkshire_landrace';}populate();
const load=src=>new Promise((resolve,reject)=>{const i=new Image;i.onload=()=>resolve(i);i.onerror=()=>reject(Error('이미지 읽기 실패'));i.src=src;});
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function hex(p,i){return'#'+Array.from(p.slice(i,i+3)).map(v=>v.toString(16).padStart(2,'0')).join('');}
function recolor(){const b=breeds[$('breed').value],map={};for(const slot of ['coat','spot','snout'])P.palette.slots[slot].forEach((c,i)=>map[c]=b[slot][i].slice(1).match(/../g).map(v=>parseInt(v,16)));const out=new ImageData(W,H),layer=raw[$('pattern').value];for(let i=0;i<out.data.length;i+=4){const p=layer?.data[i+3]?layer.data:raw.base.data;if(!p[i+3])continue;out.data.set([...(map[hex(p,i)]||Array.from(p.slice(i,i+3))),255],i);}atlas=canvas(W,H);atlas.getContext('2d').putImageData(out,0,0);$('status').textContent=b.label+' · '+$('pattern').selectedOptions[0].text+' · 39프레임 / 15행';draw(performance.now());}
function draw(now){if(!atlas)return;const s=Number($('scale').value);for(const r of rows){const step=Math.floor((now-start)/r.a.ms),f=playing?(r.a.loop?step%r.a.frames:Math.min(step,r.a.frames-1)):Number(r.slider.value);r.slider.value=f;r.card.dataset.frame=f;r.counter.textContent=(f+1)+' / '+r.a.frames;const c=r.c;if(c.width!==N*s)c.width=c.height=N*s;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,c.width,c.height);x.save();if($('flip').checked&&r.name.endsWith('_right')){x.translate(c.width,0);x.scale(-1,1);}x.drawImage(atlas,f*N,r.a.row*N,N,N,0,0,N*s,N*s);x.restore();}const x=$('after').getContext('2d');x.clearRect(0,0,128,128);x.drawImage(atlas,0,P.meta.anims.idle_right.row*N,N,N,0,0,128,128);}
function pause(){playing=false;$('play').textContent='재생';}$('play').onclick=()=>{playing=!playing;if(playing)start=performance.now();$('play').textContent=playing?'일시정지':'재생';draw(performance.now());};$('restart').onclick=()=>{playing=true;start=performance.now();$('play').textContent='일시정지';draw(start);};$('breed').onchange=()=>{$('pattern').value=breeds[$('breed').value].pattern||'none';recolor();};$('pattern').onchange=recolor;$('scale').onchange=$('flip').onchange=()=>draw(performance.now());
$('breedFile').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text()),next=data.breeds||data;for(const b of Object.values(next))for(const[s,n]of [['coat',4],['spot',4],['snout',3]])if(!Array.isArray(b[s])||b[s].length!==n||b[s].some(v=>!/^#[0-9a-f]{6}$/i.test(v)))throw Error('품종 슬롯 오류');breeds=next;populate();recolor();}catch(e){$('status').textContent=e.message;}};
Promise.all(Object.entries(P.images).map(async([k,v])=>{const im=await load(v),c=canvas(W,H),x=c.getContext('2d');x.drawImage(im,0,0);raw[k]=x.getImageData(0,0,W,H);})).then(async()=>{const before=await load(P.old),x=$('before').getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(before,0,0,128,128);for(const[name,a]of Object.entries(P.meta.anims)){const card=document.createElement('section');card.className='card';card.dataset.anim=name;const title=document.createElement('h2');title.textContent=name+' · '+a.ms+'ms'+(a.loop?' · 반복':' · 1회');const viewport=document.createElement('div');viewport.className='viewport';const c=canvas(N,N);c.setAttribute('aria-label',name);viewport.append(c);const slider=document.createElement('input');slider.type='range';slider.min=0;slider.max=a.frames-1;slider.value=0;slider.setAttribute('aria-label',name+' 프레임');slider.oninput=()=>{pause();draw(performance.now());};const counter=document.createElement('span');card.append(title,viewport,slider,counter);$('grid').append(card);rows.push({name,a,card,c,slider,counter});}recolor();window.artReview={ready:true,metadata:P.meta,stats:()=>({breed:$('breed').value,pattern:$('pattern').value,frames:Object.fromEntries(rows.map(r=>[r.name,Number(r.card.dataset.frame)]))})};function loop(t){if(playing)draw(t);requestAnimationFrame(loop);}requestAnimationFrame(loop);}).catch(e=>{$('status').textContent=e.message;});
</script></html>
